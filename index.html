<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada VoIP</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <style>
    body {
      background: #0f1016;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e1f29;
      padding: 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #btn-accion {
      background: #00c853;
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      margin-top: 15px;
      width: 100%;
      cursor: pointer;
    }
    #log {
      font-size: 13px;
      color: #aaa;
      margin-top: 15px;
      text-align: left;
      background: #12131a;
      padding: 10px;
      border-radius: 8px;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3 id="titulo">Conectando...</h3>
    <button id="btn-accion" onclick="activarTodo()">🔊 ACTIVAR VOZ / REANUDAR</button>
    <div id="log">Iniciando...</div>
  </div>

  <script>
    function escribir(txt) {
      const l = document.getElementById("log");
      l.innerHTML += "• " + txt + "<br>";
      l.scrollTop = l.scrollHeight;
    }

    const params = new URLSearchParams(window.location.search);
    const canal = params.get("canal");
    const miUid = parseInt(params.get("uid")) || Math.floor(Math.random() * 8000) + 1000;
    const appId = "81df5645a3e8486481ddd64dac89f2fe";
    const urlGenerador = "https://llamadas-voip.vercel.app/api/token";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let microfonoLocal = null;
    let audioRemoto = null;

    // 1. Escuchar usuarios remotos ANTES de unirse
    client.on("user-published", async (user, mediaType) => {
      escribir("Usuario detectado en canal: " + user.uid);
      await client.subscribe(user, mediaType);
      if (mediaType === "audio") {
        audioRemoto = user.audioTrack;
        escribir("Audio remoto suscrito. Reproduciendo...");
        reproducirRemoto();
      }
    });

    client.on("user-unpublished", (user) => {
      escribir("Usuario desconectado: " + user.uid);
    });

    function reproducirRemoto() {
      if (audioRemoto) {
        audioRemoto.play();
        audioRemoto.setVolume(100);
        document.getElementById("titulo").innerText = "¡En llamada activa!";
      }
    }

    async function iniciar() {
      if (!canal) {
        escribir("Error: No hay canal en la URL");
        return;
      }
      try {
        escribir("Obteniendo token para UID: " + miUid);
        const resp = await fetch(`${urlGenerador}?canal=${canal}&uid=${miUid}`);
        const data = await resp.json();

        escribir("Uniendo al canal " + canal + "...");
        await client.join(appId, canal, data.token, miUid);
        escribir("Conectado exitosamente.");

        // Capturar micrófono local
        escribir("Activando micrófono local...");
        microfonoLocal = await AgoraRTC.createMicrophoneAudioTrack({
          AEC: true,
          AGC: true,
          ANS: true
        });

        // Publicar micrófono al canal
        await client.publish([microfonoLocal]);
        escribir("Micrófono transmitiendo ✔");
        document.getElementById("titulo").innerText = "Micrófono listo";
      } catch (err) {
        escribir("Error: " + err.message);
      }
    }

    function activarTodo() {
      AgoraRTC.resumeAudio();
      if (microfonoLocal) {
        microfonoLocal.setEnabled(true);
      }
      reproducirRemoto();
      escribir("Audio reanudado manualmente.");
    }

    iniciar();
  </script>
</body>
</html>
