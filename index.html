<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada VoIP</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 25px; }
    #btn-hablar {
      display: none;
      background: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h3 id="estado">Iniciando llamada...</h3>
  <button id="btn-hablar" onclick="activarAudioManual()">Toca aquí para Activar Audio</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const canal = params.get("canal");
    // Si viene uid en la URL lo usa, sino genera uno aleatorio
    const miUid = parseInt(params.get("uid")) || Math.floor(Math.random() * 8000) + 1000;
    const appId = "81df5645a3e8486481ddd64dac89f2fe";
    const urlGenerador = "https://llamadas-voip.vercel.app/api/token";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack;

    async function conectar() {
      if (!canal) {
        document.getElementById("estado").innerText = "Falta el número de canal";
        return;
      }

      try {
        document.getElementById("estado").innerText = "Obteniendo conexión...";
        const resp = await fetch(`${urlGenerador}?canal=${canal}`);
        const data = await resp.json();

        // 1. Unirse con su propio UID único
        await client.join(appId, canal, data.token, miUid);
        document.getElementById("estado").innerText = "En llamada (Canal " + canal + ")";

        // 2. Publicar micrófono
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({
          AEC: true,
          AGC: true,
          ANS: true
        });
        await client.publish([localAudioTrack]);

        // 3. Suscribirse al audio del otro usuario
        client.on("user-published", async (user, mediaType) => {
          await client.subscribe(user, mediaType);
          if (mediaType === "audio") {
            try {
              user.audioTrack.play();
              user.audioTrack.setVolume(100);
            } catch (err) {
              // Si el navegador bloqueó la reproducción automática
              document.getElementById("btn-hablar").style.display = "inline-block";
            }
          }
        });
      } catch (e) {
        document.getElementById("estado").innerText = "Error: " + e.message;
      }
    }

    function activarAudioManual() {
      AgoraRTC.resumeAudio();
      document.getElementById("btn-hablar").style.display = "none";
    }

    conectar();
  </script>
</body>
</html>
