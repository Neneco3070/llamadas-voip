<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada en Curso</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <style>
    body {
      background: #0f1016;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e1f29;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 80%;
      max-width: 320px;
    }
    #btn-desbloqueo {
      background: #00c853;
      color: #fff;
      border: none;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      margin-top: 20px;
      cursor: pointer;
      width: 100%;
    }
    #estado { font-size: 17px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h3 id="estado">Iniciando audio...</h3>
    <button id="btn-desbloqueo" onclick="desbloquearSonido()">🔊 TOCAR PARA ACTIVAR VOZ</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const canal = params.get("canal");
    const miUid = parseInt(params.get("uid")) || Math.floor(Math.random() * 8000) + 1000;
    const appId = "81df5645a3e8486481ddd64dac89f2fe";
    const urlGenerador = "https://llamadas-voip.vercel.app/api/token";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack;
    let remoteAudioTracks = [];

    async function iniciar() {
      if (!canal) {
        document.getElementById("estado").innerText = "Falta el número de canal";
        return;
      }

      try {
        // 1. Obtener token firmado para el UID exacto
        document.getElementById("estado").innerText = "Conectando al canal...";
        const resp = await fetch(`${urlGenerador}?canal=${canal}&uid=${miUid}`);
        const data = await resp.json();

        // 2. Unirse al canal con ese UID
        await client.join(appId, canal, data.token, miUid);
        document.getElementById("estado").innerText = "Conectado. Toca el botón verde.";

        // 3. Crear y publicar el micrófono
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({
          AEC: true,
          AGC: true,
          ANS: true
        });
        await client.publish([localAudioTrack]);

        // 4. Recibir el audio del otro usuario
        client.on("user-published", async (user, mediaType) => {
          await client.subscribe(user, mediaType);
          if (mediaType === "audio") {
            remoteAudioTracks.push(user.audioTrack);
            reproducirAudioRemoto(user.audioTrack);
          }
        });
      } catch (err) {
        document.getElementById("estado").innerText = "Error: " + err.message;
      }
    }

    function reproducirAudioRemoto(track) {
      try {
        track.play();
        track.setVolume(100);
        document.getElementById("estado").innerText = "¡En llamada activa!";
      } catch (e) {
        document.getElementById("estado").innerText = "Pulsa el botón verde para escuchar";
      }
    }

    function desbloquearSonido() {
      // Desbloquea la política de audio del navegador
      AgoraRTC.resumeAudio();
      remoteAudioTracks.forEach(track => {
        try {
          track.play();
          track.setVolume(100);
        } catch(e) {}
      });
      document.getElementById("btn-desbloqueo").style.background = "#555";
      document.getElementById("btn-desbloqueo").innerText = "Audio Activado ✔";
      document.getElementById("estado").innerText = "¡En llamada activa!";
    }

    iniciar();
  </script>
</body>
</html>
