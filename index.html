<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Llamada VoIP</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f1016;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .call-card {
      background: #1c1d27;
      padding: 35px 25px;
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .avatar-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b2e42, #181924);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 36px;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    p#estado {
      margin: 0 0 30px;
      font-size: 14px;
      color: #00e676;
      font-weight: 500;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, filter 0.2s ease;
      margin-bottom: 14px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-green {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #0d131f;
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.3);
    }
    .btn-red {
      background: linear-gradient(135deg, #ff334b, #e60026);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(230, 0, 38, 0.35);
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="call-card">
    <div class="avatar-icon">🎙️</div>
    <h2 id="txt-titulo">Llamada en curso</h2>
    <p id="estado">Conectando...</p>

    <!-- Botón verde para activar audio/reproducir -->
    <button class="btn btn-green" id="btn-activar" onclick="activarTodo()">
      <span>🔊</span> <span id="txt-activar">ACTIVAR VOZ</span>
    </button>

    <!-- Botón rojo para colgar y salir -->
    <button class="btn btn-red" id="btn-colgar" onclick="colgarYLuegoCerrar()">
      <span>📞</span> <span id="txt-colgar">FINALIZAR LLAMADA</span>
    </button>
  </div>

  <script>
    // Detección automática de idioma (Inglés / Español)
    const esIngles = navigator.language && navigator.language.startsWith("en");

    const textos = {
      es: {
        titulo: "Llamada en curso",
        conectando: "Conectando...",
        conectado: "En llamada activa",
        btnActivar: "ACTIVAR VOZ",
        btnColgar: "FINALIZAR LLAMADA",
        finalizada: "Llamada finalizada"
      },
      en: {
        titulo: "Call in progress",
        conectando: "Connecting...",
        conectado: "Active call",
        btnActivar: "ACTIVATE VOICE",
        btnColgar: "END CALL",
        finalizada: "Call ended"
      }
    };

    const t = esIngles ? textos.en : textos.es;

    document.getElementById("txt-titulo").innerText = t.titulo;
    document.getElementById("estado").innerText = t.conectando;
    document.getElementById("txt-activar").innerText = t.btnActivar;
    document.getElementById("txt-colgar").innerText = t.btnColgar;

    // Configuración de Agora RTC
    const params = new URLSearchParams(window.location.search);
    const canal = params.get("canal");
    const miUid = parseInt(params.get("uid")) || Math.floor(Math.random() * 8000) + 1000;
    const appId = "81df5645a3e8486481ddd64dac89f2fe";
    const urlGenerador = "https://llamadas-voip.vercel.app/api/token";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let microfonoLocal = null;

    // 1. Escuchar usuarios remotos y suscribir audio de inmediato
    client.on("user-published", async (user, mediaType) => {
      await client.subscribe(user, mediaType);
      if (mediaType === "audio") {
        reproducirPista(user.audioTrack);
      }
    });

    client.on("user-unpublished", () => {
      document.getElementById("estado").innerText = t.finalizada;
    });

    function reproducirPista(track) {
      if (track) {
        try {
          track.play();
          track.setVolume(100);
          document.getElementById("estado").innerText = t.conectado;
        } catch (e) {
          console.warn("Autoplay bloqueado por el navegador:", e);
        }
      }
    }

    async function iniciar() {
      if (!canal) return;
      try {
        const resp = await fetch(`${urlGenerador}?canal=${canal}&uid=${miUid}`);
        const data = await resp.json();

        // Unirse al canal
        await client.join(appId, canal, data.token, miUid);

        // Crear micrófono con parámetros de voz optimizados
        microfonoLocal = await AgoraRTC.createMicrophoneAudioTrack({
          AEC: true,
          AGC: true,
          ANS: true
        });

        // Publicar la pista local
        await client.publish([microfonoLocal]);
        document.getElementById("estado").innerText = t.conectado;

        // Si ya hay usuarios conectados antes de entrar, suscribirse a ellos
        client.remoteUsers.forEach(async (user) => {
          if (user.hasAudio) {
            await client.subscribe(user, "audio");
            reproducirPista(user.audioTrack);
          }
        });

      } catch (err) {
        document.getElementById("estado").innerText = "Error: " + err.message;
      }
    }

    function activarTodo() {
      // 1. Desbloquear contexto de audio de Chrome
      AgoraRTC.resumeAudio();

      // 2. Asegurar transmisión del micrófono propio
      if (microfonoLocal) {
        microfonoLocal.setEnabled(true);
      }

      // 3. Forzar reproducción de todas las pistas remotas activas
      client.remoteUsers.forEach((user) => {
        if (user.audioTrack) {
          user.audioTrack.play();
          user.audioTrack.setVolume(100);
        }
      });

      document.getElementById("estado").innerText = t.conectado;
    }

    async function colgarYLuegoCerrar() {
      document.getElementById("estado").innerText = t.finalizada;

      if (microfonoLocal) {
        microfonoLocal.stop();
        microfonoLocal.close();
      }

      await client.leave();

      window.close();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "about:blank";
      }
    }

    iniciar();
  </script>
</body>
</html>
