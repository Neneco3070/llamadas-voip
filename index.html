<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada VoIP</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:15px;">
  <p id="estado">Obteniendo credenciales...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const canal = params.get("canal");
    const appId = "81df5645a3e8486481ddd64dac89f2fe"; // Tu App ID
    const urlGenerador = "https://llamadas-voip.vercel.app/api/token";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack;

    async function conectarLlamada() {
      if (!canal) {
        document.getElementById("estado").innerText = "Falta el número de canal";
        return;
      }

      try {
        // 1. Solicita el token dinámico a Vercel en milisegundos
        document.getElementById("estado").innerText = "Conectando al servidor...";
        const resp = await fetch(`${urlGenerador}?canal=${canal}`);
        const data = await resp.json();

        if (!data.token) {
          throw new Error("No se pudo obtener el token de llamada");
        }

        // 2. Conecta la llamada con el token automático
        await client.join(appId, canal, data.token, null);
        document.getElementById("estado").innerText = "Conectado al canal: " + canal;

        // 3. Activa micrófono con volumen y cancelación de eco
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack({
          AEC: true,
          AGC: true,
          ANS: true
        });
        await client.publish([localAudioTrack]);

        // 4. Recibe y reproduce el audio del otro usuario
        client.on("user-published", async (user, mediaType) => {
          await client.subscribe(user, mediaType);
          if (mediaType === "audio") {
            user.audioTrack.play();
            user.audioTrack.setVolume(100);
            document.getElementById("estado").innerText = "¡En llamada activa!";
          }
        });
      } catch (error) {
        document.getElementById("estado").innerText = "Error: " + error.message;
      }
    }

    conectarLlamada();
  </script>
</body>
</html>
